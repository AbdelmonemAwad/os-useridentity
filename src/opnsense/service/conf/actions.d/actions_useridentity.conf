#
# The page's questions, its Apply, and the collector as a service. errors:no on each script here:
# it prints a JSON answer and exits 0, and this keeps the answer if one ever does not.

[status]
command:/usr/local/opnsense/scripts/useridentity/status.py
parameters:
errors:no
type:script_output
message:reading what User Identity knows

# The live map, an address a row: the Users tab.
[map]
command:/usr/local/opnsense/scripts/useridentity/status.py map
parameters:
errors:no
type:script_output
message:reading User Identity's map

# The aliases made to say what the settings say, and XGS: Settings' cut list where os-xgs-npu is
# installed. The page's Apply goes on with the source, the filter and the collector.
[apply]
command:/usr/local/opnsense/scripts/useridentity/aliases.php
parameters:
errors:no
type:script_output
message:writing User Identity's aliases

# Every alias of the plugin's taken out - its removal runs it while its files are still there.
[remove]
command:/usr/local/opnsense/scripts/useridentity/aliases.php --remove
parameters:
errors:no
type:script_output
message:removing User Identity's aliases

# syslog-ng's source written, or taken away, after the checks that keep syslog-ng from stopping.
[source]
command:/usr/local/opnsense/scripts/useridentity/syslogng.py apply
parameters:
errors:no
type:script_output
message:writing User Identity's syslog-ng source

# The tables of aliases gone, taken out of pf: a table outlives its alias.
[gone]
command:/usr/local/opnsense/scripts/useridentity/tables.py flush-gone
parameters:
errors:no
type:script_output
message:taking the tables of User Identity's aliases gone out of pf

# Every mapping forgotten, the tables emptied: Users' Forget all, and the plugin turned off.
[flush]
command:/usr/local/opnsense/scripts/useridentity/expire.py --flush
parameters:
errors:no
type:script_output
message:forgetting User Identity's mappings

# One user asked of the directory: Groups' Test. The name is quoted by configd.
[ldaptest]
command:/usr/local/opnsense/scripts/useridentity/ldap_groups.py test
parameters:%s
errors:no
type:script_output
message:asking the directory about a user

# The collector. The "one" prefix tells rc.subr to do as it is asked: whether it runs is decided by
# the setting in config.xml (plugins.inc.d/useridentity.inc starts it at boot), not by rc.conf.
[start]
command:/usr/local/etc/rc.d/useridentity onestart
parameters:
type:script
message:starting the User Identity collector

[stop]
command:/usr/local/etc/rc.d/useridentity onestop
parameters:
type:script
message:stopping the User Identity collector

[restart]
command:/usr/local/etc/rc.d/useridentity onerestart
parameters:
type:script
message:restarting the User Identity collector
